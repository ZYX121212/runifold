[package]
name = "runifold-eval-cli"
description = "CLI and CI quality gates for Runifold evaluations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "runifold-eval"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.2"
clap = { version = "4.6.4", features = ["derive"] }
futures-util.workspace = true
runifold-core = { version = "0.5.2", path = "../runifold-core" }
runifold-testkit = { version = "0.5.2", path = "../runifold-testkit" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "fs"] }
