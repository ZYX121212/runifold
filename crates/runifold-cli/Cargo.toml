[package]
name = "runifold-cli"
description = "Read-only operational CLI for Runifold artifacts and durable journals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
publish.workspace = true

[[bin]]
name = "runifold"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env"] }
runifold-core.workspace = true
runifold-ops.workspace = true
runifold-store-postgres = { version = "0.7.2", path = "../runifold-store-postgres" }
runifold-store-sqlite = { version = "0.7.2", path = "../runifold-store-sqlite" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
