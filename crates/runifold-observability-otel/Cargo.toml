[package]
name = "runifold-observability-otel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
publish.workspace = true
description = "OpenTelemetry GenAI instrumentation for Runifold"

[lints]
workspace = true

[dependencies]
async-stream.workspace = true
futures-util.workspace = true
opentelemetry = "0.32.0"
runifold-core.workspace = true
runifold-model.workspace = true
runifold-workflow = { version = "0.7.2", path = "../runifold-workflow" }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
opentelemetry-prometheus = { version = "0.32.0", default-features = false }
opentelemetry_sdk = { version = "0.32.1", features = ["trace", "metrics", "testing"] }
prometheus = { version = "0.14", default-features = false }
runifold-testkit.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
yaml-rust2 = "0.11.0"
