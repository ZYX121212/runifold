[package]
name = "runifold-providers"
description = "Feature-gated model provider adapters for Runifold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
publish.workspace = true

[features]
default = []
anthropic = ["dep:eventsource-stream", "dep:httpdate"]
bedrock = ["dep:aws-sdk-bedrockruntime", "dep:aws-smithy-types"]
gemini = ["dep:eventsource-stream", "dep:runifold-retrieval"]
ollama = ["dep:runifold-retrieval"]
openai = [
    "dep:eventsource-stream",
    "dep:futures-channel",
    "dep:httpdate",
    "dep:js-sys",
    "dep:runifold-retrieval",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
async-stream.workspace = true
aws-sdk-bedrockruntime = { version = "=1.124.0", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = { version = "=1.4.3", optional = true }
base64 = { version = "0.22" }
eventsource-stream = { workspace = true, optional = true }
futures-channel = { version = "0.3", optional = true }
futures-timer = { version = "3", features = ["wasm-bindgen"] }
futures-util.workspace = true
httpdate = { workspace = true, optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "multipart"] }
runifold-core.workspace = true
runifold-model.workspace = true
runifold-retrieval = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec = "1"
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
aws-smithy-eventstream = "=0.60.18"
runifold-provider-testkit.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[lints]
workspace = true

[target.wasm32-unknown-unknown.dev-dependencies]
wasm-bindgen-test = "0.3.76"

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", features = ["net"], optional = true }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "Event",
    "EventTarget",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MessageEvent",
    "Navigator",
    "RtcDataChannel",
    "RtcConfiguration",
    "RtcIceConnectionState",
    "RtcIceGatheringState",
    "RtcIceServer",
    "RtcIceTransportPolicy",
    "RtcPeerConnection",
    "RtcPeerConnectionState",
    "RtcRtpSender",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcTrackEvent",
    "WebSocket",
    "Window",
], optional = true }
