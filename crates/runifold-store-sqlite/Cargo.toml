[package]
name = "runifold-store-sqlite"
description = "Durable SQLite stores for Runifold effects, checkpoints, journals, and workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
publish.workspace = true

[features]
default = []
bundled = ["rusqlite/bundled"]

[dependencies]
futures-executor.workspace = true
runifold-agent.workspace = true
runifold-core.workspace = true
runifold-effect.workspace = true
runifold-model.workspace = true
runifold-ops = { version = "0.7.0", path = "../runifold-ops" }
runifold-workflow.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["rt"] }
uuid.workspace = true

[dev-dependencies]
runifold-testkit.workspace = true
runifold-tool.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
