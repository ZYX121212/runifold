[package]
name = "runifold"
description = "Typed and observable runtime for models, tools, agents, and workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
publish.workspace = true

[features]
default = ["runtime"]
runtime = [
    "dep:runifold-agent",
    "dep:runifold-effect",
    "dep:runifold-macros",
    "dep:runifold-retrieval",
    "dep:runifold-tool",
    "dep:runifold-workflow",
    "dep:schemars",
    "dep:serde_json",
]
otel = ["dep:runifold-observability-otel"]
mcp = ["runtime", "dep:runifold-mcp"]
sqlite = ["runtime", "dep:runifold-store-sqlite"]
sqlite-bundled = ["sqlite", "runifold-store-sqlite/bundled"]
qdrant = ["runtime", "dep:runifold-retrieval-qdrant"]
pgvector = ["runtime", "dep:runifold-retrieval-pgvector"]
workflow-postgres = ["runtime", "dep:runifold-store-postgres"]
archive-s3 = [
    "runtime",
    "dep:reqwest",
    "dep:sha2",
    "dep:base64",
    "dep:serde_json",
    "dep:time",
    "dep:hmac",

    "dep:secrecy",
]

[dependencies]
runifold-agent = { workspace = true, optional = true }
runifold-core.workspace = true
runifold-effect = { workspace = true, optional = true }
runifold-mcp = { version = "0.8.1", path = "../runifold-mcp", optional = true }
runifold-model.workspace = true
runifold-macros = { workspace = true, optional = true }
runifold-observability-otel = { version = "0.8.1", path = "../runifold-observability-otel", optional = true }
runifold-retrieval = { workspace = true, optional = true }
runifold-retrieval-pgvector = { workspace = true, optional = true }
runifold-retrieval-qdrant = { workspace = true, optional = true }
runifold-store-sqlite = { workspace = true, optional = true }
runifold-tool = { workspace = true, optional = true }
runifold-workflow = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
runifold-store-postgres = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
serde_json = { workspace = true, optional = true }
time = { version = "=0.3.47", optional = true, features = ["formatting"] }
hmac = { version = "0.12", optional = true }
secrecy = { workspace = true, optional = true }

[dev-dependencies]
anyhow = "1.0.104"
futures-executor.workspace = true
runifold-providers = { path = "../runifold-providers", features = ["anthropic", "gemini", "ollama", "openai-realtime"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
runifold-testkit = { path = "../runifold-testkit" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[target.wasm32-unknown-unknown.dev-dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.76"
wasm-bindgen-test = "0.3.76"
web-sys = { version = "0.3", features = ["RtcPeerConnection", "RtcDataChannel", "RtcDataChannelEvent", "RtcConfiguration", "RtcIceConnectionState", "RtcIceGatheringState", "RtcIceServer", "RtcIceTransportPolicy", "RtcPeerConnectionState", "RtcSessionDescription", "RtcSessionDescriptionInit", "RtcSdpType", "MessageEvent", "Event"] }

[[example]]
name = "error_context"
required-features = ["runtime"]

[[example]]
name = "parallel_workflow"
required-features = ["runtime"]

[[example]]
name = "quickstart"
required-features = ["runtime"]

[[example]]
name = "race_workflow"
required-features = ["runtime"]

[[example]]
name = "workflow_chain"
required-features = ["runtime"]

[[test]]
name = "typed_tool_macro"
required-features = ["runtime"]

[[test]]
name = "wasm_browser_provider"
required-features = ["runtime"]

[lints]
workspace = true
