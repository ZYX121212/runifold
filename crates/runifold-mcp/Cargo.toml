[package]
name = "runifold-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
publish.workspace = true
description = "Capability-safe Model Context Protocol edge for Runifold"

[lints]
workspace = true

[features]
workflow-tasks = ["dep:runifold-workflow", "dep:uuid"]

[dependencies]
async-stream.workspace = true
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
base64 = "0.23.0"
eventsource-stream.workspace = true
futures-util.workspace = true
reqwest.workspace = true
runifold-core = { version = "0.3.0", path = "../runifold-core" }
runifold-model = { version = "0.3.0", path = "../runifold-model" }
runifold-tool = { version = "0.3.0", path = "../runifold-tool" }
runifold-workflow = { version = "0.3.0", path = "../runifold-workflow", optional = true }
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
time = { version = "=0.3.47", features = ["parsing", "formatting"] }
tokio = { version = "1.53.1", features = ["io-util", "io-std", "process", "rt", "sync", "time", "macros", "rt-multi-thread", "net"] }
url.workspace = true
uuid = { workspace = true, optional = true }

[dev-dependencies]
runifold-testkit = { path = "../runifold-testkit" }
