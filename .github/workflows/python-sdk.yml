name: Python SDK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-wheel:
    name: Installed wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/python-sdk
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and validation tools
        run: python -m pip install 'maturin==1.15.0' 'pytest>=8' 'pytest-asyncio>=0.24' 'mypy>=1.18' 'ruff==0.17.3'
      - name: Check version and licenses
        # The version helper uses stdlib tomllib, available from Python 3.11.
        if: matrix.python == '3.14'
        run: python scripts/python-sdk-version.py
      - name: Build portable Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: v1.15.0
          target: x86_64
          manylinux: 2_28
          args: --release --locked --compatibility pypi --manifest-path bindings/python/Cargo.toml --out dist -i python3.10
      - name: Build native wheel
        if: runner.os != 'Linux'
        run: maturin build --release --locked --manifest-path bindings/python/Cargo.toml --out dist
      - name: Install wheel and exercise native protocols
        run: |
          python -m pip install dist/*.whl
          python -m pytest bindings/python/tests -q
          python bindings/python/examples/offline.py
          python bindings/python/examples/recovery.py
          ruff check bindings/python/python bindings/python/tests bindings/python/examples
          ruff format --check bindings/python/python bindings/python/tests bindings/python/examples
          python -m mypy --config-file bindings/python/pyproject.toml bindings/python/python/runifold
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-sdk-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
  source-and-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/python-sdk-source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Source distribution installation in a fresh environment
        run: |
          python -m pip install 'maturin==1.15.0'
          maturin sdist --manifest-path bindings/python/Cargo.toml --out dist
          python -m venv /tmp/runifold-sdk-install
          /tmp/runifold-sdk-install/bin/python -m pip install dist/*.tar.gz pytest pytest-asyncio
          cd /tmp
          /tmp/runifold-sdk-install/bin/python -m pytest "$GITHUB_WORKSPACE/bindings/python/tests" -q
          /tmp/runifold-sdk-install/bin/python "$GITHUB_WORKSPACE/bindings/python/examples/offline.py"
          /tmp/runifold-sdk-install/bin/python "$GITHUB_WORKSPACE/bindings/python/examples/recovery.py"
      - name: Native formatting and Clippy
        run: |
          cargo fmt --manifest-path bindings/python/Cargo.toml -- --check
          cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Audit the independent native dependency lockfile
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file bindings/python/Cargo.lock
      - name: Rust minimum version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          CARGO_TARGET_DIR=target/python-sdk-msrv cargo +1.88.0 check --manifest-path bindings/python/Cargo.toml --locked
