name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  feature-contracts:
    name: Feature contract (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: providers-none
            package: runifold-providers
            features: ""
          - name: providers-anthropic
            package: runifold-providers
            features: anthropic
          - name: providers-bedrock
            package: runifold-providers
            features: bedrock
          - name: providers-gemini
            package: runifold-providers
            features: gemini
          - name: providers-ollama
            package: runifold-providers
            features: ollama
          - name: providers-openai
            package: runifold-providers
            features: openai
          - name: facade-none
            package: runifold
            features: ""
          - name: facade-native-providers
            package: runifold
            features: anthropic,bedrock,gemini,ollama,openai
          - name: facade-compatible-providers
            package: runifold
            features: azure,ark,deepseek,groq,minimax,mistral,openrouter,perplexity,qwen,siliconflow,together,xai,zhipu
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-feature-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Test isolated feature contract
        shell: bash
        env:
          RUNIFOLD_FEATURES: ${{ matrix.features }}
          RUNIFOLD_PACKAGE: ${{ matrix.package }}
        run: |
          args=(
            --package "$RUNIFOLD_PACKAGE"
            --all-targets
            --no-default-features
            --locked
          )
          if [[ -n "$RUNIFOLD_FEATURES" ]]; then
            args+=(--features "$RUNIFOLD_FEATURES")
          fi
          cargo test "${args[@]}"

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-quality-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check default feature contract
        run: cargo check --workspace --all-targets --locked

      - name: Check all targets and features
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        shell: bash
        run: |
          set +e
          cargo test --workspace --all-features --locked 2>&1 | tee test-output.log
          test_status="${PIPESTATUS[0]}"
          set -e
          if [[ "$test_status" != "0" ]]; then
            details="$(
              grep -n -E -C 12 'panicked at|FAILED|error: test failed' test-output.log |
                tail -n 160 || true
            )"
            [[ -n "$details" ]] || details="$(tail -n 160 test-output.log)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Rust test failure::$details"
            exit "$test_status"
          fi

      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-test-output
          path: test-output.log
          if-no-files-found: error
          retention-days: 14

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify publish dependency order
        run: scripts/publish-crates.sh --list

      - name: Assemble distributable packages
        run: cargo package --workspace --locked --no-verify

  wasm-edge:
    name: WASM edge and browser runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Cache Cargo and WASM tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-edge-1.85-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-wasm-bindgen-0.2.126-chrome-150.0.7871.124

      - name: Install pinned Rust target
        run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown

      - name: Install pinned WASM test runner
        shell: bash
        run: |
          if [[ "$(wasm-bindgen-test-runner --version 2>/dev/null || true)" != \
            "wasm-bindgen-test-runner 0.2.126" ]]; then
            cargo install wasm-bindgen-cli --version 0.2.126 --locked
          fi

      - name: Compile the provider-neutral facade for WASM
        run: |
          cargo +1.85.0 check -p runifold \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --locked

      - name: Execute edge runtime semantics in Node
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo +1.85.0 test -p runifold-core \
            --target wasm32-unknown-unknown \
            --test wasm_edge \
            --locked

      - name: Install pinned headless Chrome and WebDriver
        shell: bash
        run: |
          npx --yes @puppeteer/browsers@3.0.6 install \
            chrome-headless-shell@150.0.7871.124 \
            --path target/browser-tools
          npx --yes @puppeteer/browsers@3.0.6 install \
            chromedriver@150.0.7871.124 \
            --path target/browser-tools

      - name: Execute Agent, embedding, control-plane, and Realtime transports in headless Chrome
        shell: bash
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_TEST_ONLY_WEB: "1"
          WASM_BINDGEN_TEST_TIMEOUT: "60"
          RUNIFOLD_BROWSER_TURN_URL: "turn:127.0.0.1:3478?transport=udp"
          RUNIFOLD_BROWSER_TURN_USERNAME: "runifold"
          RUNIFOLD_BROWSER_TURN_CREDENTIAL: "turn-secret"
          RUNIFOLD_BROWSER_TURN_FAULT_ENDPOINT: "http://127.0.0.1:38087/turn-fault"
          RUNIFOLD_BROWSER_TURN_RECOVER_ENDPOINT: "http://127.0.0.1:38087/turn-recover"
        run: |
          browser="$(
            realpath "$(
              find target/browser-tools/chrome-headless-shell \
                -type f -name chrome-headless-shell -perm -111 -print -quit
            )"
          )"
          driver="$(
            realpath "$(
              find target/browser-tools/chromedriver \
                -type f -name chromedriver -perm -111 -print -quit
            )"
          )"
          [[ -n "$browser" && -n "$driver" ]]

          turn_image="ghcr.io/coturn/coturn@sha256:0feee4fc1f45c7c053c8fee3e1ab941b1a1b9a0429bc01e18126735410770bfd"
          docker pull "$turn_image"
          docker run -d --name runifold-coturn \
            -p 3478:3478/tcp \
            -p 3478:3478/udp \
            -p 49160-49170:49160-49170/udp \
            "$turn_image" \
            --log-file=stdout \
            --fingerprint \
            --lt-cred-mech \
            --realm=runifold.local \
            --user=runifold:turn-secret \
            --listening-port=3478 \
            --min-port=49160 \
            --max-port=49170 \
            --external-ip=127.0.0.1 \
            --allow-loopback-peers \
            --no-multicast-peers \
            --no-tls \
            --no-dtls
          for attempt in {1..30}; do
            if docker logs runifold-coturn 2>&1 |
              grep -q "Relay ports initialization done"; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker logs runifold-coturn
              exit 1
            fi
            sleep 1
          done

          python3 - "$browser" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path("target/browser-tools/webdriver.json")
          path.write_text(
              json.dumps(
                  {
                      "goog:chromeOptions": {
                          "binary": sys.argv[1],
                          "args": [
                              "--use-fake-device-for-media-stream",
                              "--use-fake-ui-for-media-stream",
                          ],
                      }
                  }
              ),
              encoding="utf-8",
          )
          PY

          fault_dir="$(mktemp -d "$PWD/target/browser-tools/turn-fault.XXXXXX")"
          turn_fault_marker="$fault_dir/requested"
          turn_recover_marker="$fault_dir/recover"
          python3 scripts/browser-provider-server.py \
            --port 38087 \
            --turn-fault-marker "$turn_fault_marker" \
            --turn-recover-marker "$turn_recover_marker" \
            >target/browser-provider-server.log 2>&1 &
          server_pid="$!"
          (
            for attempt in {1..600}; do
              if [[ -f "$turn_fault_marker" ]]; then
                docker stop runifold-coturn >/dev/null
                break
              fi
              sleep 0.1
            done
            [[ -f "$turn_fault_marker" ]] || exit 1
            for attempt in {1..600}; do
              if [[ -f "$turn_recover_marker" ]]; then
                docker start runifold-coturn >/dev/null
                exit 0
              fi
              sleep 0.1
            done
            exit 1
          ) &
          fault_pid="$!"
          trap '
            kill "$server_pid" "$fault_pid" 2>/dev/null || true
            docker rm -f runifold-coturn >/dev/null 2>&1 || true
          ' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:38087/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              cat target/browser-provider-server.log
              exit 1
            fi
            sleep 1
          done

          export CHROMEDRIVER="$driver"
          export WASM_BINDGEN_TEST_WEBDRIVER_JSON="$PWD/target/browser-tools/webdriver.json"
          cargo +1.85.0 test -p runifold \
            --target wasm32-unknown-unknown \
            --no-default-features \
            --features anthropic,gemini,ollama,openai \
            --test wasm_browser_provider \
            --locked \
            -- --nocapture

          python3 scripts/write-wasm-browser-evidence.py \
            --output target/reliability-evidence/wasm-browser-provider.json \
            --revision "${{ github.sha }}" \
            --rustc "$(rustc +1.85.0 --version)" \
            --browser "$("$browser" --version)" \
            --driver "$("$driver" --version | head -n 1)" \
            --wasm-bindgen "$(wasm-bindgen-test-runner --version)" \
            --turn-image "$turn_image"

      - name: Write WASM reliability evidence
        run: |
          python3 scripts/write-wasm-evidence.py \
            --output target/reliability-evidence/wasm-edge.json \
            --revision "${{ github.sha }}" \
            --rustc "$(rustc +1.85.0 --version)" \
            --node "$(node --version)" \
            --wasm-bindgen "$(wasm-bindgen-test-runner --version)"

      - name: Upload WASM reliability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasm-edge-reliability-${{ github.sha }}
          path: target/reliability-evidence/wasm-edge.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload browser Provider reliability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasm-browser-provider-reliability-${{ github.sha }}
          path: target/reliability-evidence/wasm-browser-provider.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasm-browser-diagnostics-${{ github.sha }}
          path: target/browser-provider-server.log
          if-no-files-found: warn
          retention-days: 14

  minio-archive:
    name: MinIO WORM archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-minio-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Start pinned MinIO
        shell: bash
        run: |
          docker run --detach --rm \
            --name runifold-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=runifold-ci \
            --env MINIO_ROOT_PASSWORD=runifold-ci-secret \
            --env MINIO_KMS_SECRET_KEY=runifold-ci:cnVuaWZvbGQtY2ktMzItYnl0ZS1zdGF0aWMta2V5ISE= \
            minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e \
            server /data

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            if [[ "$attempt" == "60" ]]; then
              docker logs runifold-minio
              exit 1
            fi
            sleep 1
          done

      - name: Create lock-enabled archive bucket
        shell: bash
        run: |
          docker run --rm \
            --network container:runifold-minio \
            --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3 \
            -c '
              mc alias set local http://127.0.0.1:9000 runifold-ci runifold-ci-secret &&
              mc mb --with-lock local/runifold-archive &&
              mc version info local/runifold-archive &&
              mc admin kms key status local
            '

      - name: Verify WORM archive against real MinIO
        env:
          RUNIFOLD_MINIO_ACCESS_KEY: runifold-ci
          RUNIFOLD_MINIO_BUCKET: runifold-archive
          RUNIFOLD_MINIO_ENDPOINT: http://127.0.0.1:9000
          RUNIFOLD_MINIO_SECRET_KEY: runifold-ci-secret
          RUNIFOLD_MINIO_STRESS_ITERATIONS: "32"
          RUNIFOLD_EVIDENCE_PATH: ${{ github.workspace }}/target/reliability-evidence/minio-worm.json
          RUNIFOLD_EVIDENCE_REVISION: ${{ github.sha }}
        run: |
          cargo test -p runifold \
            --features archive-s3 \
            --test live_minio \
            lock_checksum_concurrency_and_reconstruction_survive_real_minio \
            --locked \
            -- --ignored --exact --nocapture

      - name: Upload MinIO reliability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minio-worm-reliability-${{ github.sha }}
          path: target/reliability-evidence/minio-worm.json
          if-no-files-found: error
          retention-days: 30

      - name: Show MinIO diagnostics
        if: failure()
        run: docker logs runifold-minio

      - name: Stop MinIO
        if: always()
        run: docker rm --force runifold-minio

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-msrv-1.85-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check declared MSRV
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Cache Cargo tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-security-tools-${{ runner.os }}-audit-0.22.2-deny-0.20.2

      - name: Install audit tools
        run: |
          command -v cargo-audit >/dev/null || cargo install cargo-audit --version 0.22.2 --locked
          command -v cargo-deny >/dev/null || cargo install cargo-deny --version 0.20.2 --locked

      - name: Audit RustSec advisories
        run: cargo audit --deny warnings

      - name: Enforce dependency policy
        run: cargo deny check advisories licenses sources

  semver:
    name: Public API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Cache cargo-semver-checks
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-semver-checks-${{ runner.os }}-0.49.0

      - name: Install cargo-semver-checks
        run: command -v cargo-semver-checks >/dev/null || cargo install cargo-semver-checks --version 0.49.0 --locked

      - name: Compare public APIs with latest release
        run: scripts/semver-check.sh
