name: Publish crates.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string
      confirmation:
        description: Version without v, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish workspace in dependency order
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-publish-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Validate requested version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRM_RUNIFOLD_PUBLISH: ${{ inputs.confirmation }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$RELEASE_TAG" = "v$version"
          test "$CONFIRM_RUNIFOLD_PUBLISH" = "$version"

      - name: Verify packages before publication
        run: cargo package --workspace --locked

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CONFIRM_RUNIFOLD_PUBLISH: ${{ inputs.confirmation }}
        run: scripts/publish-crates.sh --execute
